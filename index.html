<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <h1>Flashcards</h1>

        <p>Card <span id="cardNumber"></span> of <span id="cardTotal"></span></p>

        <h2 id="wordText"></h2>
        <p id="meaningText"></p>

        <button id="flipBtn">Show meaning</button>
        <button id="nextBtn">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
